# Синтетическая экосистема для dpmeta-cli sync --corpus (ТЗ, §6.2, :tests:corpus).
schema = 1

[[repo]]
name = "Alpha"
slug = "example/Alpha"
clone = "alpha"
place = "core"
decisions = { path = "docs/direction/DECISIONS.md", id = "D-\\d+" }

[[repo]]
name = "Beta"
slug = "example/Beta"
clone = "beta"
place = "support"
decisions = { path = "docs/direction/DECISIONS.md", id = "Р\\d+" }

# Строка управления (DPmetaApp:D-46, DPmeta:M-16): подсистемы с `dir` живут в её клоне.
[[repo]]
name = "Pult"
slug = "example/Pult"
clone = "dpmetaapp"
place = "control"
decisions = { path = "docs/direction/DECISIONS.md", id = "D-\\d+" }

[[repo]]
name = "DPmeta"
slug = "example/DPmeta"
place = "sync"
dir = "dpmeta"
decisions = { path = "docs/DECISIONS.md", id = "M-\\d+" }

[[repo]]
name = "Gamma"
slug = "example/Gamma"
clone = "gamma"
place = "archive"
