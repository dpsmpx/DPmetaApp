# Каталог событий пульта (ТЗ, §8.1, F-51; D-85).
#
# Уведомить можно о любом событии каталога (D-22). Событие неизвестного типа
# движок отбрасывает с RULE_INVALID, а не превращает в «прочее».
#
#   type     тип латиницей, части через точку
#   title    подпись для экрана
#   source   sync — синхронизация, push — мгновенный канал, listener — слушатель
#            уведомлений, app — само приложение
#   channel  вид канала уведомлений (F-38): claude, dev, social, site, questions, sync
#   fields   текстовые поля для условий; проект и текст события — у всех
#   numbers  числовые поля для условий «не меньше / не больше»
#
# Новый тип — строка здесь и источник, который его порождает.

schema = 1

[[event]]
type = "pr.opened"
title = "PR открыт"
source = ["sync"]
channel = "dev"
fields = ["branch", "author", "title"]

[[event]]
type = "pr.updated"
title = "PR обновлён"
source = ["sync"]
channel = "dev"
fields = ["branch", "author", "title"]

[[event]]
type = "pr.ready"
title = "PR переведён из черновика"
source = ["sync"]
channel = "dev"
fields = ["branch", "author", "title"]

[[event]]
type = "pr.merged"
title = "PR влит"
source = ["sync"]
channel = "dev"
fields = ["branch", "author", "title"]

[[event]]
type = "pr.closed"
title = "PR закрыт"
source = ["sync"]
channel = "dev"
fields = ["branch", "author", "title"]

[[event]]
type = "pr.comment"
title = "Комментарий в PR"
source = ["sync"]
channel = "dev"
fields = ["author"]

[[event]]
type = "pr.review"
title = "Ревью PR"
source = ["sync"]
channel = "dev"
fields = ["author"]

[[event]]
type = "pr.waiting_author"
title = "PR ждёт автора дольше порога"
source = ["app"]
channel = "dev"
fields = ["title"]
numbers = ["hours"]

[[event]]
type = "checks.red"
title = "Проверки красные"
