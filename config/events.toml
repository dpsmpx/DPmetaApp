channel = "dev"
fields = ["branch"]
numbers = ["days"]

[[event]]
type = "decision.new"
title = "Новое решение"
source = ["sync"]
channel = "dev"
fields = ["number"]

[[event]]
type = "roadmap.step.done"
title = "Отмечен шаг ROADMAP"
source = ["sync"]
channel = "dev"
fields = ["number"]

[[event]]
type = "todo.author.new"
