# Реестр команд пульта (ТЗ, F-40, F-43; D-82, D-176).
# Команды идут в клоне выбранного проекта пользователя.
# project — только "*": проект выбирается на экране; привязки к проектам автора запрещены (D-176).
# workdir — каталог внутри проекта без «..»; нет — корень проекта.
# path — путь гостя /bin, /usr/bin, /usr/local/bin или путь от workdir.
# args — строки без оболочки и подстановок; plan — foreground | background.
# level — 0 (чтение) или 1 (правка дерева); packages — пакеты Alpine.
# expect — ожидаемый вывод; timeout — минуты, 1…30.
# Мост Termux снят D-173; plan читается для совместимости прежнего schema=1.
# Новая команда — правка файла с проверкой tools/check (config.commands).

schema = 1

[[command]]
id = "repo.ff"
title = "Догнать origin"
project = "*"
path = "/usr/bin/git"
args = ["merge", "--ff-only", "@{upstream}"]
plan = "background"
level = 1
packages = ["git"]
expect = "Fast-forward или Already up to date; разошлось — отказ git, рабочее дерево не меняется"
timeout = 2
