clone = "socialmediaimage"
place = "core"
dir = "socialmediaimage"
decisions = { path = "docs/direction/DECISIONS.md", id = "Д\\d+" }
defs = [{ path = "docs/identity/IDENTITY_CONFLICTS.md", id = "IC-\\d+" }]

[[repo]]
name = "DP_game_market_analytic_system"
slug = "dpsmpx/DP_game_market_analytic_system"
clone = "dp_game_market_analytic_system"
place = "core"
