# Сборка из корня (D-28): настройки Gradle — как у подсистемы dpai/. Версия DPmetaApp — по этапу
# ROADMAP (этап N — 0.N.0, до выхода этапа — 0.N.0-dev.M; D-54); её показывает и приложение
# :shell. У подсистемы dpai/ — своя, в её gradle.properties.
version=0.4.0-dev.45
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.welcome=never
# Плагин Kotlin не пишет статистику сборки (FUS) в ~/.gradle/kotlin-profile: сам он её
# не отправляет, но в файлах — путь проекта и версия ОС, их забирает статистика IDE,
# если её включили (D-10; найдено и проверено в dppass/, DPpass:D-12). У включённых
# сборок dpai/ и dpai/build-logic — свои свойства, там то же.
kotlin.internal.collectFUSMetrics=false
