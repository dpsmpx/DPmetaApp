# Версии всех зависимостей DP_AI_Orcestrator — в одном месте.
#
# Новая зависимость или смена версии — только вместе со строкой в
# docs/PROVENANCE.md (D-17); сверку делает tools/verify/check_dependencies.py.
# Обновление — по причине (уязвимость, нужная возможность, требование
# платформы), а не «потому что вышло» (docs/PROCESS.md, «Зависимости»).
#
# Ядро во время выполнения зависит только от Kotlin stdlib (D-17):
# библиотеки ниже — инструменты сборки и тестов.

[versions]
kotlin = "2.4.20"
junit = "6.1.3"
# Модуль android (D-34): только при Android SDK.
agp = "9.4.1"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
# SSH на JVM для приложения Android (D-35).
jsch = "2.28.7"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Модуль android (D-34).
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }

# Плагины для build-logic (подключаются как обычные зависимости).
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
