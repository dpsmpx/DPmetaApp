# Версии всех зависимостей DPpass — в одном месте.
#
# Новая зависимость или смена версии — только вместе со строкой в
# docs/legal/THIRD_PARTY_MATRIX.md и docs/PROVENANCE.md (D-20); сверку
# делает tools/provenance/check_dependencies.py (шаг hostcheck).
# Обновление — по чек-листу D-18, а не «потому что вышло».

[versions]
kotlin = "2.4.20"
agp = "9.4.1"
kotlinx-coroutines = "1.11.0"
junit = "6.1.3"

android-compileSdk = "36"
android-targetSdk = "36"
android-minSdk = "26"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Плагины для build-logic (подключаются как обычные зависимости).
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
