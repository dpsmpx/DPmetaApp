# Модель экосистемы dpsmpx — источник (D-02).
#
# Узлы — то, между чем течёт информация; потоки — направленные связи
# «от → к». У каждого узла и потока — ссылки на источники в форме
# `Проект:путь` или `Проект:номер` (DPmeta:C-06): о проекте прав его
# репозиторий, о связях — DPmeta (D-01). Каталоги видов, состояний,
# транспорта и сигналов — ТЗ, §8, и tools/dpvis/model.py.
#
# После правки: python3 -m tools.dpvis model build — собирает
# data/model.json; tools/check/run.sh сверяет, что сборка не отстала.
#
# Поля узла: id, name, kind, layer, role, refs; у репозитория — repo
# (slug GitHub), group, visibility, stage; у сервиса — probes; status
# (active | planned | blocked | off, по умолчанию active), note, row.
#
# Поля потока: id, from, to, kind, what, transport, refs и/или contracts;
# status, driver, trigger, format, note, bidirectional, via, signal.

schema = 1
title = "Экосистема dpsmpx"
as_of = "2026-10-09"
timezone = "+03:00"
sources = [
  "DPmeta:docs/ECOSYSTEM.md",
  "DPmeta:docs/CONTRACTS.md",
  "DPmeta:tools/ecosystem.toml",
  "DPmetaApp:docs/direction/TECHNICAL_TASK.md",
  "DPmetaApp:MESTER_TECHNICAL_TASK_ROADMAP.md",
  "DP_AI_Orcestrator:README.md",
  "SocialMediaImage:Д43",
  "SocialMediaImage:docs/platforms/WEBSITE.md",
  "SocialMediaImage:data/platforms/destinations.yaml",
  "SocialMediaImage:data/progress/scope.yaml",
]

[allow]
# Пробы — только к этим адресам (D-03, ТЗ T-04).
hosts = ["dpsmpx.com", "www.dpsmpx.com"]

[registry]
# Откуда сборщик берёт реестр и контракты DPmeta для сверки (D-11, F-18).
node = "dpmeta"
path = "tools/ecosystem.toml"
contracts = "docs/CONTRACTS.md"

