name: Verify and build DPmetaApp APK

on:
  push:
    branches:
      - main
      - 'build/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a signed prerelease from main after strict checks'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  # Never interrupt a main-branch release between creating its draft and publishing it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  apk:
    permissions:
      contents: read
    name: Strict checks, primary studio APK and modern comparison APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          curl --fail --location --retry 3 --silent --show-error \
            'https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip' \
            -o "$RUNNER_TEMP/cmdline.zip"
          printf '%s  %s\n' '04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7' \
            "$RUNNER_TEMP/cmdline.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$RUNNER_TEMP/sdktools"
          "$RUNNER_TEMP/sdktools/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            --install 'platforms;android-37.0' 'build-tools;36.1.0' \
            'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Verify interface themes and render screens
        id: interface
        timeout-minutes: 8
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew --console=plain :shell:testDebugUnitTest \
            -Pdpmeta.screenshots -Pdpmeta.screenshots.dir=build/interface-screenshots \
            --tests 'com.dpsmpx.dpmeta.shell.AppearanceTest' \
            --tests 'com.dpsmpx.dpmeta.shell.ScreenshotsTest'
      - name: Upload interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPmetaApp-interface-${{ github.sha }}
          path: build/interface-screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Full repository verification
        id: strict
        continue-on-error: true
        shell: bash
        run: tools/check/run.sh full --strict --verbose
      - name: Preserve failing JUnit test reports
        if: steps.strict.outcome == 'failure' || steps.interface.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: DPmetaApp-test-results-${{ github.sha }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 7
      - name: Build primary DPmetaApp APK (targetSdk 28)
        shell: bash
        env:
          DPAI_RELEASE_DEBUG_KEY: '1'
        run: |
          set -euo pipefail
          sh tools/build-apk.sh release
          mkdir -p build/apk/primary
          cp shell/build/outputs/apk/release/*.apk build/apk/primary/DPmetaApp.apk
          badging="$("$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging build/apk/primary/DPmetaApp.apk)"
          grep -F "package: name='com.dpsmpx.dpai'" <<< "$badging"
          grep -F "sdkVersion:'30'" <<< "$badging"
          grep -F "targetSdkVersion:'28'" <<< "$badging"
      - name: Build optional modern-policy APK (targetSdk 36)
        shell: bash
        env:
          DPAI_TARGET_SDK: '36'
          DPAI_RELEASE_DEBUG_KEY: '1'
        run: |
          set -euo pipefail
          sh tools/build-apk.sh release
          mkdir -p build/apk/modern
          cp shell/build/outputs/apk/release/*.apk build/apk/modern/DPmetaApp-modern-target.apk
          badging="$("$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging build/apk/modern/DPmetaApp-modern-target.apk)"
          grep -F "package: name='com.dpsmpx.dpai'" <<< "$badging"
          grep -F "sdkVersion:'30'" <<< "$badging"
          grep -F "targetSdkVersion:'36'" <<< "$badging"
      - name: Publish artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          cd build/apk
          find . -name '*.apk' -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Upload APKs and SHA-256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: DPmetaApp-apk-${{ github.sha }}
          path: build/apk/
          if-no-files-found: error
          retention-days: 14
      - name: Require green full-strict result
        if: steps.strict.outcome != 'success'
        shell: bash
        run: |
          echo 'full --strict failed: APKs (if created) are diagnostic only; merge into main is forbidden.'
          exit 1
      - name: Require green interface result
        if: steps.interface.outcome != 'success'
        shell: bash
        run: |
          echo 'Interface verification failed: APKs are diagnostic only.'
          exit 1

  signed-release:
    name: Build, verify and publish author-signed prerelease
    needs: apk
    if: >-
      ${{ needs.apk.result == 'success' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_release)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out verified source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          curl --fail --location --retry 3 --silent --show-error \
            'https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip' \
            -o "$RUNNER_TEMP/cmdline.zip"
          printf '%s  %s\n' '04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7' \
            "$RUNNER_TEMP/cmdline.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$RUNNER_TEMP/sdktools"
          "$RUNNER_TEMP/sdktools/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            --install 'platforms;android-37.0' 'build-tools;36.1.0' \
            'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Validate release version and available secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if test -z "${!secret_name}"; then
              echo "Missing repository Actions secret: $secret_name"
              exit 1
            fi
          done
          version="$(sed -n 's/^version=//p' gradle.properties)"
          [[ "$version" =~ ^0\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]] || {
            echo 'Only a versioned development prerelease is supported by this workflow'
            exit 1
          }
          test -f "docs/releases/$version.md" || { echo 'Release notes are missing'; exit 1; }
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          umask 077
          install -d -m 700 "$RUNNER_TEMP/dpai-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dpai-signing/release-key.keystore"
          test -s "$RUNNER_TEMP/dpai-signing/release-key.keystore" || { echo 'Empty release keystore'; exit 1; }
          # The build-logic plugin reads dotted dpai.release.* Gradle properties.
          # Passing their names as ORG_GRADLE_PROJECT_* env variables did not reach
          # this included build: it silently selected the debug signingConfig.
          # A private Gradle user-home properties file is the documented input.
          python3 - <<'PY'
          import os
          from pathlib import Path

          def java_property(value: str) -> str:
              result = []
              for char in value:
                  if char == '\\':
                      result.append('\\\\')
                  elif char == '\n':
                      result.append('\\n')
                  elif char == '\r':
                      result.append('\\r')
                  elif char == '\t':
                      result.append('\\t')
                  elif char in ' =:#!':
                      result.append('\\' + char)
                  elif 32 <= ord(char) <= 126:
                      result.append(char)
                  else:
                      data = char.encode('utf-16-be')
                      result.extend('\\u%04x' % int.from_bytes(data[i:i + 2], 'big') for i in range(0, len(data), 2))
              return ''.join(result)

          directory = Path(os.environ['RUNNER_TEMP']) / 'dpai-gradle-home'
          directory.mkdir(mode=0o700, exist_ok=True)
          props = directory / 'gradle.properties'
          entries = {
              'dpai.release.storeFile': str(Path(os.environ['RUNNER_TEMP']) / 'dpai-signing/release-key.keystore'),
              'dpai.release.storePassword': os.environ['KEYSTORE_PASSWORD'],
              'dpai.release.keyAlias': os.environ['KEY_ALIAS'],
              'dpai.release.keyPassword': os.environ['KEY_PASSWORD'],
          }
          with props.open('x', encoding='ascii') as output:
              for key, value in entries.items():
                  output.write(key + '=' + java_property(value) + '\n')
          props.chmod(0o600)
          PY
          test "$(stat -c '%a' "$RUNNER_TEMP/dpai-gradle-home/gradle.properties")" = 600
      - name: Build and verify primary APK using author key
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/dpai-gradle-home
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          # No debug-signing override: Gradle must receive all four author-key properties.
          sh tools/build-apk.sh release
          mkdir -p build/release
          apk="build/release/DPmetaApp-${RELEASE_VERSION}-release.apk"
          cp shell/build/outputs/apk/release/*.apk "$apk"
          test -s "$apk"
          cert="$(keytool -exportcert \
            -keystore "$RUNNER_TEMP/dpai-signing/release-key.keystore" \
            -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD \
            | openssl x509 -inform DER -noout -fingerprint -sha256 \
            | sed 's/.*=//;s/://g' | tr 'A-F' 'a-f')"
          [[ "$cert" =~ ^[0-9a-f]{64}$ ]] || { echo 'Could not read author certificate'; exit 1; }
          export PATH="$ANDROID_HOME/build-tools/36.1.0:$PATH"
          python3 tools/release/check_apk.py "$apk" --cert "$cert"
          badging="$(aapt dump badging "$apk")"
          grep -F "package: name='com.dpsmpx.dpai'" <<< "$badging"
          grep -F "sdkVersion:'30'" <<< "$badging"
          grep -F "targetSdkVersion:'28'" <<< "$badging"
          grep -F "versionName='${RELEASE_VERSION}'" <<< "$badging"
          (cd build/release && sha256sum -- *.apk > SHA256SUMS.txt)
          printf '%s\n' "$cert" > build/release/SIGNING_CERT_SHA256.txt
      - name: Publish verified assets to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release: $tag"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Refusing to reuse existing tag: $tag"
            exit 1
          fi
          apk="build/release/DPmetaApp-${RELEASE_VERSION}-release.apk"
          notes="$RUNNER_TEMP/release-notes.md"
          cp "docs/releases/${RELEASE_VERSION}.md" "$notes"
          printf '\n\nИсходный коммит: `%s`. Строгие проверки: GitHub Actions, успешный job `apk`.\n' "$GITHUB_SHA" >> "$notes"
          gh release create "$tag" "$apk" build/release/SHA256SUMS.txt \
            build/release/SIGNING_CERT_SHA256.txt --target "$GITHUB_SHA" \
            --title "DPmetaApp ${RELEASE_VERSION}" --notes-file "$notes" --draft --prerelease
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for asset in "$(basename "$apk")" SHA256SUMS.txt SIGNING_CERT_SHA256.txt; do
            grep -Fxq "$asset" <<< "$assets" || { echo "Missing uploaded asset: $asset"; exit 1; }
          done
          gh release edit "$tag" --draft=false --prerelease
          gh release view "$tag" --json url,isDraft,isPrerelease,tagName \
            --jq 'if (.isDraft == false and .isPrerelease == true) then .url else error("Release state incorrect") end'
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/dpai-signing/release-key.keystore"; then
            rm -f "$RUNNER_TEMP/dpai-signing/release-key.keystore"
          fi
          if test -f "$RUNNER_TEMP/dpai-gradle-home/gradle.properties"; then
            rm -f "$RUNNER_TEMP/dpai-gradle-home/gradle.properties"
          fi
