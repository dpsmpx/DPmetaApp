# Границы страницы прогресса (Д38; docs/platforms/WEBSITE.md, «Страница прогресса»).
#
# Какие репозитории входят в счёт, как они называются публично и что о них
# можно сказать. Это граница публичного и внутреннего: сборка сайта берёт
# отсюда имена и роли, а инструмент сбора (tools/cs/progress/collect.py) —
# список клонов. Числа здесь не хранятся.
#
# visibility: public      — открытый репозиторий, имя и роль публичны
#             private     — закрытый репозиторий, имя и роль публичны (Д17: только факты и вехи)
#             undisclosed — закрытый, имя не публикуется (PROJECT_MAP: «не упоминать»);
#                           на сайте — только в общих суммах как «закрытый проект»
# group:      core | background (Д5, docs/identity/PROJECT_MAP.md)
# what:       id факта с публичной ролью (data/facts/facts.yaml)
# layer:      слой на карте экосистемы
schema: progress_scope/v1
timezone: "+03:00"                 # дни — по московскому времени (так датирует коммиты автор)
authors:                           # чьи коммиты считаются; остальные (исходные проекты форков) — нет
  ai: [Claude]
  human: [dpsmpx, "Ваше Имя"]      # «Ваше Имя» — заглушка git config в первом коммите Galdhold (DPprofile F-0049)
layers:
  - {id: product, ru: Продукты, en: Products}
  - {id: engineering, ru: Инженерная основа, en: Engineering foundation}
  - {id: knowledge, ru: Знание и публикация, en: Knowledge and publishing}
  - {id: meta, ru: Мета-уровень, en: Meta layer}
  - {id: background, ru: Ранние и малые проекты, en: Earlier and smaller projects}
repos:
  - key: galdhold
    slug: dpsmpx/Galdhold
    name: Galdhold
    group: core
    visibility: private
    layer: product
    what: GH-GENRE
    project: galdhold
    former_names: [VoxelRPG]
    reported:                      # что README игры пишет о себе (verification: reported)
      - id: hostcheck
        file: README.md
        pattern: '([0-9][0-9\u00a0 ]*[0-9]) автоматическими проверками'
  - key: dplang
    slug: dpsmpx/DPlang
    name: DPlang
    group: core
    visibility: private
    layer: product
    what: DP-WHAT
    project: dplang
  - key: dpverify
    slug: dpsmpx/DP-Verify
    name: DP-Verify
    group: core
    visibility: private
    layer: engineering
    what: VRF-WHAT
  - key: undisclosed
    slug: dpsmpx/DPpass
    name: null                     # не публикуется (PROJECT_MAP: «не упоминать»; решение автора 05.10.2026)
    group: core
    visibility: undisclosed
    layer: product
  - key: smi
    slug: dpsmpx/SocialMediaImage
    name: SocialMediaImage
    group: core
    visibility: private
    layer: knowledge
    what: SMI-WHAT
  - key: dpprofile
    slug: dpsmpx/DPprofile
    name: DPprofile
    group: core
    visibility: private
    layer: knowledge
    what: PRF-WHAT
    counters:
      - {id: facts, glob: "docs/facts/F-*.md"}
      - {id: insights, glob: "docs/insights/I-*.md"}
      - {id: sources, file: docs/sources/REGISTRY.md, pattern: '^\| *S-\d+'}
      - {id: timeline, file: docs/timeline/TIMELINE.md, pattern: '^\| \d{4}-\d\d-\d\d'}
  - key: dplearn
    slug: dpsmpx/DPlearn
    name: DPlearn
    group: core
    visibility: private
    layer: knowledge
    what: LRN-WHAT
  - key: market
    slug: dpsmpx/DP_game_market_analytic_system
    name: DP_game_market
    group: core
    visibility: private
    layer: knowledge
    what: MKT-WHAT
  - key: dpmeta
    slug: dpsmpx/DPmeta
    name: DPmeta
    group: core
    visibility: private
    layer: meta
    what: META-WHAT
    counters:
      - {id: contracts, file: docs/CONTRACTS.md, pattern: '^#{2,3} +C-\d+'}
      - {id: risks, file: docs/RISKS.md, pattern: '^#{2,3} +RISK-\d+'}
      - {id: sync_queue, file: docs/SYNC_QUEUE.md, pattern: '^#{2,3} +SQ-\d+'}
      - {id: principles, file: docs/PRINCIPLES.md, pattern: '^#{2,3} +E-\d+'}
      - {id: reports, glob: "docs/reports/*.md"}
  - key: repeated
    slug: dpsmpx/DP_Repeated_Tasks
    name: DP_Repeated_Tasks
    group: background
    visibility: public
    layer: background
  - key: tanks
    slug: dpsmpx/tanks_blitz_stat_chat
    name: tanks_blitz_stat_chat
    group: background
    visibility: public
    layer: background
  - key: ecosystem
    slug: dpsmpx/DP_Ecosystem
    name: DP_Ecosystem
    group: background
    visibility: public
    layer: background
    what: ECO-WHAT
  - key: tjtm
    slug: dpsmpx/TrueJointTileMaker
    name: TrueJointTileMaker
    group: background
    visibility: public
    layer: background
    what: TJTM-WHAT
  - key: pixrogue
    slug: dpsmpx/PixRogue
    name: PixRogue
    group: background
    visibility: public
    layer: background
    what: PIX-WHAT
  - key: andors_love
    slug: dpsmpx/Andors-Love
    name: Andors-Love
    group: background
    visibility: public
    layer: background
    what: AL-WHAT
excluded:                          # с работой в периоде, но вне счёта — и почему
  - {slug: dpsmpx/gravitydefied, reason: форк чужого проекта — вне иерархии проектов (Д5)}
  - {slug: dpsmpx/andors-trail-load, reason: форк чужого проекта — вне иерархии проектов (Д5)}
  - {slug: dpsmpx/dpsmpx, reason: README профиля GitHub — не проект; правит только автор (DPmeta C-07)}
  - {slug: dpsmpx/MAIN_OBSIDIAN_PC_works, reason: личные заметки (Д2)}
  - {slug: dpsmpx/dayplan_neocities, reason: личный планировщик и резюме (Д2)}
  - {slug: dpsmpx/Mobile-Basic-set-line-numbers, reason: одиночный скрипт вне карты проектов}
  - {slug: dpsmpx/DP_3D_Works, reason: одиночный скрипт вне карты проектов}
relations:                         # связи между репозиториями — из контрактов DPmeta (docs/CONTRACTS.md)
  - from: galdhold
    to: dplang
    both: true
    source: DPmeta C-01
    ru: "решения повторены с обеих сторон; Galdhold от DPlang не зависит"
    en: "decisions are mirrored on both sides; Galdhold does not depend on DPlang"
  - from: galdhold
    to: dpprofile
    source: DPmeta C-04
    ru: "факты о проекте со ссылкой на коммит, без кода"
    en: "facts about the project, citing commits, without code"
  - from: galdhold
    to: smi
    source: DPmeta C-04
    ru: "факты и вехи для публикаций"
    en: "facts and milestones for publishing"
  - from: dplang
    to: dpprofile
    source: DPmeta C-04
    ru: "факты о проекте со ссылкой на коммит, без кода"
    en: "facts about the project, citing commits, without code"
  - from: dpverify
    to: galdhold
    planned: true
    source: DPmeta C-03
    ru: "поставка общих проверок копией — план"
    en: "shared checks delivered as a copy — planned"
  - from: dpverify
    to: dplang
    planned: true
    source: DPmeta C-03
    ru: "поставка общих проверок копией — план"
    en: "shared checks delivered as a copy — planned"
  - from: andors_love
    to: tjtm
    source: DPmeta C-08
    ru: "формат карт и имена тайлов"
    en: "map format and tile names"
