# Реестр репозиториев экосистемы dpsmpx — машинная часть docs/ECOSYSTEM.md.
#
# Читают tools/xref.py, tools/activity.py и tools/manifest.py; как данные из
# клона — DPvisualisation (C-11); строго, с перечнем ключей, — по плану DPmetaApp
# (его ТЗ, F-01): новое поле согласовывать и с ним. Поля:
#   name       — каноническое имя проекта (docs/NAMING.md);
#   slug       — репозиторий GitHub сейчас;
#   clone      — каталог клона относительно --root (переопределяется --clone);
#                нет такого — ищется по имени из slug: `Andors-Love`,
#                `andors-love`, `dpsmpx/andors-love`;
#   aliases    — прежние и рабочие имена: ссылка через них сверяется так же,
#                но считается устаревшим именем (docs/NAMING.md);
#   names      — другие написания того же имени (не устаревшие);
#   decisions  — журнал решений: путь и шаблон номера (регулярное выражение);
#   defs       — где ещё определены номера, на которые ссылаются другие
#                репозитории (ТЗ, реестры); шаблон — тот же формат;
#   place      — место в экосистеме по слову автора (M-10): control —
#                управление, core — ядро, support — поддерживающий слой,
#                meta — DPmeta, archive — вне текущей системы (в манифест
#                dpai.ecosystem не входит, M-11).
# Порядок записей — порядок строк и столбцов в отчёте.

schema = 1

[[repo]]
name = "Galdhold"
slug = "dpsmpx/Galdhold"
clone = "galdhold"
place = "core"
aliases = ["VoxelRPG", "3D_Voxel_OpenWorld_RPG", "3DOWVRPG"]
decisions = { path = "docs/direction/DECISIONS.md", id = "Р\\d+" }

[[repo]]
name = "DPlang"
slug = "dpsmpx/DPlang"
clone = "dplang"
place = "core"
aliases = ["dpsmpx/C-"]
decisions = { path = "docs/direction/DECISIONS.md", id = "Р\\d+" }
defs = [{ path = "docs/direction/OPEN_DECISIONS.md", id = "О\\d+" }]

[[repo]]
name = "DP-Verify"
slug = "dpsmpx/DP-Verify"
clone = "dp-verify"
place = "core"
names = ["DP Verify"]
decisions = { path = "docs/direction/DECISIONS.md", id = "V-\\d+" }
defs = [{ path = "docs/direction/TECHNICAL_TASK.md", id = "(?:TR|[FNIALRQ])-\\d+" }]

