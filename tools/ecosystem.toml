# Периферия: вне общего процесса, но с контрактом C-08 (формат карт).

[[repo]]
name = "Andors-Love"
slug = "dpsmpx/Andors-Love"
clone = "andors-love"

[[repo]]
name = "TrueJointTileMaker"
slug = "dpsmpx/TrueJointTileMaker"
clone = "truejointtilemaker"

[[repo]]
name = "DPmeta"
slug = "dpsmpx/DPmeta"
clone = "DPmeta"
decisions = { path = "docs/DECISIONS.md", id = "M-\\d+" }
defs = [
  { path = "docs/CONTRACTS.md", id = "C-\\d+" },
  { path = "docs/RISKS.md", id = "RISK-\\d+" },
  { path = "docs/SYNC_QUEUE.md", id = "SQ-\\d+" },
  { path = "docs/PRINCIPLES.md", id = "E-\\d+" },
]
