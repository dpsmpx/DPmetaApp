org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# Сборка не отправляет данные наружу: без приветствий и сканов сборки.
org.gradle.welcome=never
# Плагин Kotlin не пишет статистику сборки (FUS) в ~/.gradle/kotlin-profile: в файлах —
# путь проекта и версия ОС, их забирает статистика IDE, если её включили
# (DPmetaApp:D-10, DPpass:D-12).
kotlin.internal.collectFUSMetrics=false

# Версия всех модулей; в jar команды dpai — Implementation-Version.
version=0.1.0-dev.6
