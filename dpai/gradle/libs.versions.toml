# Версии всех зависимостей DP_AI_Orcestrator — в одном месте.
#
# Новая зависимость или смена версии — только вместе со строкой в
# docs/PROVENANCE.md (D-17); сверку делает tools/verify/check_dependencies.py.
# Обновление — по причине (уязвимость, нужная возможность, требование
# платформы), а не «потому что вышло» (docs/PROCESS.md, «Зависимости»).
#
# Ядро во время выполнения зависит только от Kotlin stdlib (D-17):
# библиотеки ниже — инструменты сборки и тестов.

[versions]
sora = "0.24.7"
# Подпись и проверка APK в приложении (D-157): та же версия, что приходит с AGP, — уже проверена в verification-metadata.
apksig = "9.4.1"
kotlin = "2.4.20"
junit = "6.1.3"
# Модуль android (D-34): только при Android SDK.
agp = "9.4.1"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
# FileProvider — «Поделиться» экспортом пульта DPmetaApp (DPmetaApp:D-67); прежде приходила
# транзитивно от activity-compose той же версии.
androidx-core = "1.18.0"
# Git на JVM — клоны репозиториев пульта DPmetaApp (DPmetaApp:D-65). Ветка 5.13 — последняя
# для Java 8: на Android (minSdk 30) нет недостающих API JDK 11+; CVE-2023-4759 в 5.13.3 закрыта.
jgit = "5.13.5.202508271544-r"
# SSH на JVM для приложения Android (D-35).
jsch = "2.28.7"
# Только модель правил пульта DPmetaApp (DPmetaApp:D-141), ядро dpai не зависит от RE2.
re2j = "1.8"
# Снимки экранов DPmetaApp на JVM (DPmetaApp:docs/SCREENSHOTS.md): только тестам модуля
# :shell корня и только по свойству dpmeta.screenshots — в APK и обычную сборку не
# попадают. Версии — те же, что у тестов экранов DPpass (DPpass:D-86): «Android
# целиком» — образ SDK 36, который ждёт Robolectric 4.17; JUnit 4 — API его запускателя.
robolectric = "4.17"
junit4 = "4.13.2"
robolectric-android-all = "16-robolectric-13921718-i7"
robolectric-android30 = "11-robolectric-6757853-i7"

[libraries]
sora-editor = { module = "io.github.rosemoe:editor", version.ref = "sora" }
sora-textmate = { module = "io.github.rosemoe:language-textmate", version.ref = "sora" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-android-all = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-android-all" }
robolectric-android30 = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-android30" }

# Модуль android (D-34).
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }
re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }

# Плагины для build-logic (подключаются как обычные зависимости): Kotlin, Android и
# Compose — с одного classpath, KGP загружается один раз (D-102).
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
